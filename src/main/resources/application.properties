spring.application.name=7max
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:poker_tracker}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

logging.file.name=C:/projects/tracker/logs/app.log
logging.level.com.sevenmax=DEBUG

app.wallets.starting-balance-editable=true

# Green-API WhatsApp Gateway (LOCAL ONLY - do not commit)
green-api.api-url=https://7107.api.greenapi.com
green-api.instance-id=7107596889
green-api.token=dc0818aec12340a592763b8dc4b4b302c8cb71bfc6ed4bcbb9

# KashCash API
kashcash.base-url=${KASHCASH_BASE_URL:https://prod-api.safecashapps.com/api/external/v1}
kashcash.username=${KASHCASH_USERNAME:}
kashcash.password=${KASHCASH_PASSWORD:}
kashcash.business-id=${KASHCASH_BUSINESS_ID:}
kashcash.pos-vendor-id=${KASHCASH_POS_VENDOR_ID:}
app.kashcash.callback-url=${KASHCASH_CALLBACK_URL:https://your-prod-domain/api/kashcash/webhook}
app.kashcash.notification-emails=${NOTIFY_EMAILS:}
app.kashcash.notification-whatsapp=${NOTIFY_WHATSAPP:0526194444,0505666501,0543474774}
app.missing-names.notification-emails=${NOTIFY_EMAILS:}

# Grow deposits, via a Make.com scenario (Custom Webhook -> Grow "Create Payment Link" -> Webhook Response)
grow.make.webhook-url=${GROW_MAKE_WEBHOOK_URL:}
grow.make.api-key=${GROW_MAKE_API_KEY:}
app.grow.notification-emails=${NOTIFY_EMAILS:}
app.whatsapp-health.notification-emails=${NOTIFY_EMAILS:}
app.whatsapp-health.enabled=${WHATSAPP_HEALTH_ENABLED:false}
app.grow.notification-whatsapp=${NOTIFY_WHATSAPP:0526194444,0505666501,0543474774}

# Public frontend URL — used in the weekly inactive-players WhatsApp link
app.frontend-url=${FRONTEND_URL:https://max7.vercel.app}

# Resend email API (kept for other notifiers; deposit emails now go via Gmail API)
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:noreply@7max.club}

# Gmail REST API (HTTPS) — used for KashCash deposit emails. Railway blocks SMTP, and Gmail's
# own account can send to any recipient with no verified domain. Needs a long-lived OAuth2
# refresh token for 7maxclub@gmail.com (scope: gmail.send).
gmail.oauth.client-id=${GMAIL_CLIENT_ID:}
gmail.oauth.client-secret=${GMAIL_CLIENT_SECRET:}
gmail.oauth.refresh-token=${GMAIL_REFRESH_TOKEN:}
gmail.from=${GMAIL_FROM:7Max Club <7maxclub@gmail.com>}
